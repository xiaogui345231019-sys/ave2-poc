name: build-ave2-poc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS runners on free accounts queue for a very long time; ubuntu is instant.
    # Cross-compile an arm64 iOS Mach-O using Theos' extracted iPhoneOS SDK.
    runs-on: ubuntu-latest
    env:
      SDK_VER: "16.5"
      APP_NAME: "agxwarm"
      SRC: "agxwarm.m"
      PLIST: "Info_agxwarm.plist"

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm curl unzip xz-utils zip make libssl-dev
          clang --version | head -1

      - name: Fetch iPhoneOS SDK (sparse checkout of theos/sdks)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-repo
          cd sdks-repo
          git sparse-checkout set "iPhoneOS${SDK_VER}.sdk"
          cd ..
          mkdir -p sdk
          mv "sdks-repo/iPhoneOS${SDK_VER}.sdk" "sdk/iPhoneOS${SDK_VER}.sdk"
          du -sh sdk
          test -f "sdk/iPhoneOS${SDK_VER}.sdk/System/Library/Frameworks/IOKit.framework/IOKit.tbd"
          test -f "sdk/iPhoneOS${SDK_VER}.sdk/System/Library/Frameworks/UIKit.framework/UIKit.tbd"
          test -f "sdk/iPhoneOS${SDK_VER}.sdk/System/Library/Frameworks/IOSurface.framework/IOSurface.tbd"
          test -f "sdk/iPhoneOS${SDK_VER}.sdk/System/Library/Frameworks/Metal.framework/Metal.tbd"
          echo "SDK ok"

      - name: Compile (arm64 iOS, ObjC + UIKit + IOKit)
        run: |
          set -euo pipefail
          SDK="$PWD/sdk/iPhoneOS${SDK_VER}.sdk"
          mkdir -p "Payload/${APP_NAME}.app"
          clang -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -Os -fobjc-arc -fno-stack-protector \
            -c "$SRC" -o app.o
          file app.o

      - name: Link
        run: |
          set -euo pipefail
          SDK="$PWD/sdk/iPhoneOS${SDK_VER}.sdk"
          ld64.lld -arch arm64 \
            -platform_version ios 16.0 16.0 \
            -syslibroot "$SDK" \
            -o "Payload/${APP_NAME}.app/${APP_NAME}" \
            app.o \
            -framework UIKit \
            -framework Foundation \
            -framework Metal -framework IOKit \
            -framework IOSurface \
            -lobjc \
            -lSystem
          file "Payload/${APP_NAME}.app/${APP_NAME}"

      - name: Package unsigned IPA (Payload/ must be the archive root)
        run: |
          set -euo pipefail
          cp "$PLIST" "Payload/${APP_NAME}.app/Info.plist"
          rm -f "${APP_NAME}.ipa"
          zip -qry "${APP_NAME}.ipa" Payload
          echo "--- archive layout ---"
          unzip -l "${APP_NAME}.ipa"
          unzip -l "${APP_NAME}.ipa" | grep -q "Payload/${APP_NAME}.app/${APP_NAME}" || { echo "MISSING Payload prefix"; exit 1; }

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ipa
          path: ${{ env.APP_NAME }}.ipa
          retention-days: 30
