name: build-ave2-poc

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS runners on free accounts queue for a very long time; ubuntu is instant.
    # We cross-compile a arm64 iOS Mach-O using Theos' extracted iPhoneOS SDK.
    runs-on: ubuntu-latest
    env:
      SDK_VER: "16.5"

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm curl unzip xz-utils zip make libssl-dev
          clang --version | head -1
          ld64.lld --version || true

      - name: Fetch iPhoneOS SDK (sparse checkout of theos/sdks)
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-repo
          cd sdks-repo
          git sparse-checkout set "iPhoneOS${SDK_VER}.sdk"
          cd ..
          mkdir -p sdk
          mv "sdks-repo/iPhoneOS${SDK_VER}.sdk" "sdk/iPhoneOS${SDK_VER}.sdk"
          du -sh sdk
          ls "sdk/iPhoneOS${SDK_VER}.sdk/System/Library/Frameworks" | head -20
          test -f "sdk/iPhoneOS${SDK_VER}.sdk/System/Library/Frameworks/IOKit.framework/IOKit.tbd"
          echo "IOKit.tbd present"

      - name: Compile (arm64 iOS)
        run: |
          set -euo pipefail
          SDK="$PWD/sdk/iPhoneOS${SDK_VER}.sdk"
          mkdir -p Payload/ave2_poc.app
          clang -target arm64-apple-ios16.0 \
            -isysroot "$SDK" \
            -F"$SDK/System/Library/Frameworks" \
            -Os -fno-stack-protector \
            -c ave2_poc.c -o ave2_poc.o
          file ave2_poc.o

      - name: Link
        run: |
          set -euo pipefail
          SDK="$PWD/sdk/iPhoneOS${SDK_VER}.sdk"
          ld64.lld -arch arm64 \
            -platform_version ios 16.0 16.0 \
            -syslibroot "$SDK" \
            -o Payload/ave2_poc.app/ave2_poc \
            ave2_poc.o \
            -framework IOKit \
            -framework CoreFoundation \
            -lSystem
          file Payload/ave2_poc.app/ave2_poc
          llvm-objdump --macho --private-headers Payload/ave2_poc.app/ave2_poc | head -30 || true

      - name: Package unsigned IPA (Payload/ must be the archive root)
        run: |
          set -euo pipefail
          cp Info.plist Payload/ave2_poc.app/Info.plist
          rm -f ave2_poc.ipa
          # iOS expects: ave2_poc.ipa -> Payload/ave2_poc.app/...
          zip -qry ave2_poc.ipa Payload
          echo "--- archive layout check ---"
          unzip -l ave2_poc.ipa
          unzip -l ave2_poc.ipa | grep -q "Payload/ave2_poc.app/ave2_poc" || { echo "MISSING Payload prefix"; exit 1; }
          ls -la ave2_poc.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ave2_poc-ipa
          path: ave2_poc.ipa
          retention-days: 30
